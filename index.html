<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Strašidelný kaštieľ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Verdana,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;width:100%}
:root{--b:clamp(46px,17vh,86px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#touch{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}
body.touch #touch{display:block}
body.touch #snd{display:none}
.tb{position:absolute;width:var(--b);height:var(--b);border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.32);color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font:bold calc(var(--b)*.34) Verdana,sans-serif;line-height:1;pointer-events:auto;touch-action:none;box-sizing:border-box;opacity:.62;text-shadow:0 1px 2px #000}
.tb small{font-size:calc(var(--b)*.15);font-weight:normal;margin-top:2px;opacity:.85}
.tb.on{background:rgba(220,40,40,.5);opacity:.95}
#tL{left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 12px)}
#tD{left:calc(var(--sl) + 10px + var(--b)*1.08);bottom:calc(var(--sb) + 12px)}
#tR{left:calc(var(--sl) + 10px + var(--b)*2.16);bottom:calc(var(--sb) + 12px)}
#tS{width:calc(var(--b)*1.25);height:calc(var(--b)*1.25);right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 12px);background:rgba(200,30,30,.22)}
#tJ{width:calc(var(--b)*1.1);height:calc(var(--b)*1.1);right:calc(var(--sr) + 22px + var(--b)*1.25);bottom:calc(var(--sb) + 12px + var(--b)*.3)}
#tRe{width:calc(var(--b)*.72);height:calc(var(--b)*.72);right:calc(var(--sr) + 16px + var(--b)*.2);bottom:calc(var(--sb) + 24px + var(--b)*1.25)}
.ts{width:38px;height:38px;right:calc(var(--sr) + 8px);font-size:15px;opacity:.5}
.ts small{display:none}
#tP{top:calc(var(--st) + 15vh)}#tB{top:calc(var(--st) + 15vh + 44px)}#tM{top:calc(var(--st) + 15vh + 88px)}#tF{top:calc(var(--st) + 15vh + 132px)}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#050203;color:#e8c8c0;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:bold 20px Georgia,serif;padding:20px}
#rotate .ph{font-size:70px;animation:rot 2.4s ease-in-out infinite;display:block;margin-bottom:14px}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch #rotate{display:flex}body.touch #touch{display:none}}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#game{image-rendering:pixelated;image-rendering:crisp-edges;transition:scale .7s ease-in-out}
#snd{position:fixed;right:8px;bottom:6px;z-index:5;display:flex;gap:6px;align-items:center;color:#a99;font-size:12px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:12px;user-select:none}
#snd button{background:none;border:0;color:#d44;font-size:16px;cursor:pointer;padding:0}
#snd input{width:80px;accent-color:#a11}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="272"></canvas><canvas id="ui" width="960" height="544"></canvas></div>
<div id="probe"></div>
<div id="touch">
<div class="tb" id="tL" data-key="ArrowLeft">◀</div><div class="tb" id="tD" data-key="ArrowDown">▼</div><div class="tb" id="tR" data-key="ArrowRight">▶</div>
<div class="tb" id="tJ" data-key="Space">▲<small>Skok</small></div><div class="tb" id="tS" data-key="KeyJ">✦<small>Paľ</small></div><div class="tb" id="tRe" data-key="KeyR">↻</div>
<div class="tb ts" id="tP" data-key="KeyP">II</div><div class="tb ts" id="tB" data-key="KeyB">☀</div><div class="tb ts" id="tM" data-key="KeyM">♪</div><div class="tb ts" id="tF" data-act="fs">⤢</div>
</div>
<div id="rotate"><span class="ph">📱</span>Otoč telefón na šírku</div>
<div id="snd"><button id="mute" title="Zvuk zap/vyp (M)">🔊</button><input id="vol" type="range" min="0" max="100" value="80" title="Hlasitosť (+/-)"></div>
<script>
'use strict';
/* =====================================================================
   STRAŠIDELNÝ KAŠTIEĽ  –  originálna hororová plošinovka
   Všetka grafika je kreslená v kóde (canvas), všetok zvuk je syntetizovaný (Web Audio).
   ===================================================================== */
const W=480,H=272,T=16;
const cv=document.getElementById('game'), gMain=cv.getContext('2d');let g=gMain;
const uic=document.getElementById('ui'), u=uic.getContext('2d');
g.imageSmoothingEnabled=false;
const BR=[0.64,0.48,0.32],BRN=['Temný','Normálny','Jasný'];

/* ---------- pomocné funkcie ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sign=v=>v<0?-1:v>0?1:0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x]}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}

/* ---------- vstup ---------- */
const keys={}, pressed={};
const BLOCK=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ControlLeft','ControlRight']);
addEventListener('keydown',e=>{
  if(BLOCK.has(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=true;
  keys[e.code]=true;
  if(document.activeElement&&document.activeElement.tagName==='INPUT')document.activeElement.blur();
  Snd.init();
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
addEventListener('pointerdown',()=>Snd.init());
const down=(...c)=>c.some(k=>keys[k]);
const hit=(...c)=>c.some(k=>pressed[k]);

/* =====================================================================
   ZVUK – Web Audio (všetko syntetizované)
   ===================================================================== */
const Snd={
  ctx:null,vol:0.8,muted:false,ready:false,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended'&&!Game.paused)this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    const c=this.ctx=new AC();
    this.comp=c.createDynamicsCompressor();
    this.comp.threshold.value=-10;this.comp.knee.value=18;this.comp.ratio.value=5;this.comp.attack.value=0.002;this.comp.release.value=0.22;
    this.master=c.createGain();this.master.gain.value=this.muted?0:this.vol;
    this.master.connect(this.comp);this.comp.connect(c.destination);
    // šum
    const n=c.sampleRate*5;this.noise=c.createBuffer(1,n,c.sampleRate);
    const d=this.noise.getChannelData(0);let b=0;for(let i=0;i<n;i++){d[i]=Math.random()*2-1;}
    // hnedý šum (pre hrom / vietor)
    this.brown=c.createBuffer(1,n,c.sampleRate);const bd=this.brown.getChannelData(0);let last=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;bd[i]=last*3.5;}
    // reverb – vygenerovaná impulzová odozva (veľká tmavá sála)
    const len=Math.floor(c.sampleRate*2.6),ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);let lp=0;
      for(let i=0;i<len;i++){const t=i/len;const w=(Math.random()*2-1)*Math.pow(1-t,2.6);lp+=(w-lp)*(0.55-0.4*t);dd[i]=lp;}}
    this.conv=c.createConvolver();this.conv.buffer=ir;
    this.revIn=c.createGain();this.revIn.gain.value=1;
    this.revOut=c.createGain();this.revOut.gain.value=0.75;
    this.revIn.connect(this.conv);this.conv.connect(this.revOut);this.revOut.connect(this.master);
    this.ready=true;
    this.startAmbient();
  },
  setVol(v){this.vol=clamp(v,0,1);this.apply();document.getElementById('vol').value=Math.round(this.vol*100)},
  toggleMute(){this.muted=!this.muted;this.apply();document.getElementById('mute').textContent=this.muted?'🔇':'🔊'},
  apply(){if(this.master)this.master.gain.setTargetAtTime(this.muted?0:this.vol,this.ctx.currentTime,0.03);document.getElementById('mute').textContent=this.muted?'🔇':'🔊'},
  pause(p){if(!this.ctx)return;p?this.ctx.suspend():this.ctx.resume()},
  /* --- stavebné bloky --- */
  src(buf,t,dur,off){const s=this.ctx.createBufferSource();s.buffer=buf||this.noise;s.start(t,off===undefined?Math.random()*1.5:off,dur);return s},
  env(gn,t,a,peak,dec){gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)},
  out(node,dry,wet,pan){const c=this.ctx;let o=node;
    if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;node.connect(p);o=p}
    if(dry){const d=c.createGain();d.gain.value=dry;o.connect(d);d.connect(this.master)}
    if(wet){const w=c.createGain();w.gain.value=wet;o.connect(w);w.connect(this.revIn)}},
  dist(k){const n=1024,cu=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;cu[i]=Math.tanh(x*k)}return cu},
  tone(type,f0,f1,t,dur,peak,dry,wet,a){const c=this.ctx,o=c.createOscillator(),gn=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    this.env(gn,t,a||0.003,peak,dur);o.connect(gn);this.out(gn,dry,wet);o.start(t);o.stop(t+dur+0.1);return gn},
  nz(t,dur,ftype,f0,f1,q,peak,a,dry,wet,buf,pan){const c=this.ctx,s=this.src(buf,t,dur+0.2),f=c.createBiquadFilter(),gn=c.createGain();
    f.type=ftype;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    this.env(gn,t,a||0.002,peak,dur);s.connect(f);f.connect(gn);this.out(gn,dry,wet,pan);return gn},
  /* --- BROKOVNICA: nárazový tresk + hlboký úder + dozvuk --- */
  shot(v){ if(!this.ready)return; const c=this.ctx,t=c.currentTime+0.001;
    const bus=c.createGain();bus.gain.value=v||1;
    const sh=c.createWaveShaper();sh.curve=this.dist(3.2);sh.oversample='2x';
    const post=c.createGain();post.gain.value=1.5;
    bus.connect(sh);sh.connect(post);
    post.connect(this.master);
    const wet=c.createGain();wet.gain.value=1.1;sh.connect(wet);wet.connect(this.revIn);
    const bp=(node)=>node.connect(bus);
    // 1) ostrý "crack"
    let s=this.src(this.noise,t,0.12),f=c.createBiquadFilter(),gn=c.createGain();f.type='highpass';f.frequency.value=1400;
    this.env(gn,t,0.0008,1.0,0.07);s.connect(f);f.connect(gn);bp(gn);
    // 2) telo výstrelu – šum s klesajúcim filtrom
    s=this.src(this.noise,t,0.6);f=c.createBiquadFilter();gn=c.createGain();f.type='lowpass';f.Q.value=0.8;
    f.frequency.setValueAtTime(7000,t);f.frequency.exponentialRampToValueAtTime(260,t+0.4);
    this.env(gn,t,0.001,1.3,0.38);s.connect(f);f.connect(gn);bp(gn);
    // 3) hlboký úder (thump)
    let o=c.createOscillator();gn=c.createGain();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(38,t+0.28);
    this.env(gn,t,0.001,1.9,0.34);o.connect(gn);bp(gn);o.start(t);o.stop(t+0.5);
    // 4) sub
    o=c.createOscillator();gn=c.createGain();o.type='triangle';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(26,t+0.5);
    this.env(gn,t,0.002,1.2,0.5);o.connect(gn);bp(gn);o.start(t);o.stop(t+0.7);
    // 5) dlhý dunivý chvost (hlavne do reverbu)
    s=this.src(this.brown,t,1.6);f=c.createBiquadFilter();gn=c.createGain();f.type='lowpass';
    f.frequency.setValueAtTime(1200,t);f.frequency.exponentialRampToValueAtTime(120,t+1.4);
    this.env(gn,t+0.02,0.01,0.7,1.4);s.connect(f);f.connect(gn);gn.connect(wet);gn.connect(post);
    // 6) vzdialená "ozvena" odrazu
    s=this.src(this.noise,t+0.17,0.5);f=c.createBiquadFilter();gn=c.createGain();f.type='bandpass';f.frequency.value=700;f.Q.value=0.6;
    this.env(gn,t+0.17,0.004,0.35,0.35);s.connect(f);f.connect(gn);gn.connect(wet);
  },
  /* pumpa "chk-chk" */
  click(t,freq,peak,dec,body){this.nz(t,dec,'bandpass',freq,freq*0.8,7,peak,0.001,0.9,0.12);
    this.tone('square',body||260,(body||260)*0.4,t,0.05,peak*0.25,0.5,0.05);
    this.tone('sine',freq*2.1,freq*2,t,0.09,peak*0.12,0.4,0.2)},
  pump(delay){ if(!this.ready)return; const t=this.ctx.currentTime+(delay||0);
    this.click(t,1500,0.9,0.07,210);          // chk (zatiahnutie)
    this.click(t+0.17,2100,1.0,0.06,330);     // chk (zasunutie)
    this.nz(t+0.03,0.12,'lowpass',900,300,1,0.25,0.01,0.7,0.1)},
  shell(){ if(!this.ready)return; const t=this.ctx.currentTime;
    this.click(t,2800,0.35,0.04,420);this.tone('sine',150,90,t+0.02,0.06,0.2,0.6,0.1)},
  dry(){ if(!this.ready)return; const t=this.ctx.currentTime;this.click(t,1000,0.5,0.03,150)},
  /* kroky a dopad */
  step(){ if(!this.ready)return;const t=this.ctx.currentTime;this.nz(t,0.07,'lowpass',500,200,1,0.12,0.002,0.7,0.1)},
  land(){ if(!this.ready)return;const t=this.ctx.currentTime;this.nz(t,0.12,'lowpass',700,150,1,0.3,0.002,0.8,0.15)},
  jump(){ if(!this.ready)return;const t=this.ctx.currentTime;this.nz(t,0.09,'bandpass',500,900,2,0.08,0.01,0.6,0.05)},
  /* zásah / smrť */
  splat(v){ if(!this.ready)return;const t=this.ctx.currentTime;v=v||1;
    this.nz(t,0.16,'bandpass',900,180,2,0.5*v,0.002,0.9,0.2);this.tone('sine',110,45,t,0.14,0.5*v,0.8,0.1)},
  gib(v){ if(!this.ready)return;const t=this.ctx.currentTime;v=v||1;
    this.nz(t,0.35,'lowpass',1800,150,1.5,0.9*v,0.002,1,0.3);
    this.nz(t+0.04,0.25,'bandpass',600,120,3,0.5*v,0.01,0.9,0.2);
    this.tone('sine',140,36,t,0.35,0.9*v,1,0.2);
    for(let i=0;i<4;i++)this.nz(t+0.05+i*0.045,0.03,'bandpass',rnd(1500,3500),900,6,0.25*v,0.001,0.7,0.1)},
  hurt(){ if(!this.ready)return;const t=this.ctx.currentTime;
    this.tone('sawtooth',260,95,t,0.3,0.4,0.8,0.15,0.01);this.nz(t,0.25,'lowpass',1500,200,2,0.4,0.002,0.8,0.1);
    this.tone('sine',90,40,t,0.3,0.8,0.9,0.1)},
  die(){ if(!this.ready)return;const t=this.ctx.currentTime;
    this.tone('sawtooth',300,55,t,1.1,0.4,0.8,0.5,0.02);this.tone('sine',70,28,t,1.2,1,1,0.3)},
  pickup(kind){ if(!this.ready)return;const t=this.ctx.currentTime;
    const notes=kind==='key'?[880,1175,1568,1760]:kind==='ammo'?[330,262]:kind==='heal'?[440,554,659]:[784,988,1175];
    notes.forEach((f,i)=>{this.tone('sine',f,f*0.99,t+i*0.07,0.5,0.22,0.6,0.5);this.tone('triangle',f*2,f*2,t+i*0.07,0.3,0.05,0.4,0.5)});
    if(kind==='ammo')this.nz(t,0.12,'bandpass',2200,1500,5,0.35,0.001,0.8,0.1)},
  checkpoint(){ if(!this.ready)return;const t=this.ctx.currentTime;
    [330,392,494].forEach((f,i)=>this.tone('triangle',f,f,t+i*0.12,1.2,0.2,0.5,0.9))},
  door(){ if(!this.ready)return;const t=this.ctx.currentTime;this.creak(1.2,0.5);this.tone('sine',80,40,t+0.9,0.5,0.9,1,0.4)},
  locked(){ if(!this.ready)return;const t=this.ctx.currentTime;this.click(t,700,0.6,0.05,120);this.click(t+0.1,500,0.5,0.05,100)},
  clear(){ if(!this.ready)return;const t=this.ctx.currentTime;
    [220,262,330,440,523].forEach((f,i)=>{this.tone('triangle',f,f,t+i*0.2,1.8,0.2,0.6,1);this.tone('sine',f*2,f*2,t+i*0.2,1.2,0.05,0.4,1)})},
  /* príšery */
  growl(type,v){ if(!this.ready)return;const c=this.ctx,t=c.currentTime;v=clamp(v,0,1);if(v<0.03)return;
    if(type==='zombie'){const f0=rnd(62,95),o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),gn=c.createGain();
      o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*0.6,t+1);
      lfo.frequency.value=rnd(5,8);lg.gain.value=9;lfo.connect(lg);lg.connect(o.frequency);
      f.type='bandpass';f.Q.value=3;f.frequency.setValueAtTime(380,t);f.frequency.linearRampToValueAtTime(900,t+0.35);f.frequency.linearRampToValueAtTime(300,t+1);
      this.env(gn,t,0.15,0.6*v,0.85);o.connect(f);f.connect(gn);this.out(gn,0.9,0.3);o.start(t);lfo.start(t);o.stop(t+1.2);lfo.stop(t+1.2);
      this.nz(t,0.9,'bandpass',700,350,2,0.2*v,0.2,0.8,0.2)}
    else if(type==='ghost'){const o=c.createOscillator(),o2=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),gn=c.createGain();
      const f0=rnd(380,520);
      [o,o2].forEach((x,i)=>{x.type=i?'triangle':'sine';x.frequency.setValueAtTime(f0*(i?1.01:1),t);x.frequency.linearRampToValueAtTime(f0*1.7,t+0.7);x.frequency.linearRampToValueAtTime(f0*0.8,t+1.6)});
      lfo.frequency.value=6;lg.gain.value=0.5;lfo.connect(lg);lg.connect(gn.gain);
      this.env(gn,t,0.5,0.28*v,1.2);o.connect(gn);o2.connect(gn);this.out(gn,0.5,1.3);
      [o,o2,lfo].forEach(x=>{x.start(t);x.stop(t+2.2)})}
    else if(type==='spider'){const gn=c.createGain(),s=this.src(this.noise,t,0.5),f=c.createBiquadFilter(),m=c.createOscillator(),mg=c.createGain();
      f.type='highpass';f.frequency.value=3500;m.type='square';m.frequency.value=rnd(22,32);mg.gain.value=0.5;
      gn.gain.value=0.5;m.connect(mg);mg.connect(gn.gain);s.connect(f);f.connect(gn);
      const eg=c.createGain();this.env(eg,t,0.02,0.7*v,0.35);gn.connect(eg);this.out(eg,0.7,0.2);m.start(t);m.stop(t+0.6)}
    else if(type==='hand'){for(let i=0;i<5;i++)this.nz(t+i*0.05,0.03,'bandpass',rnd(2500,4000),2000,5,0.25*v,0.001,0.7,0.1)}
    else if(type==='brute'){const o=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),gn=c.createGain(),sh=c.createWaveShaper();

function genWall(th,seed){
  const r=mulberry(seed),[c,x]=mkCanvas(384,H);
  const b=th.wall;
  // tapeta
  for(let i=0;i<384;i+=2){x.fillStyle=col(b,(i%8<4?5:-3));x.fillRect(i,0,2,176)}
  const gr=x.createLinearGradient(0,0,0,176);gr.addColorStop(0,'rgba(0,0,0,.55)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
  x.fillStyle=gr;x.fillRect(0,0,384,176);
  // damaškový vzor
  for(let px=0;px<384;px+=32)for(let py=18;py<176;py+=40){const ox=px+((py/40|0)%2)*16;
    x.fillStyle=col(b,-14);x.beginPath();x.moveTo(ox,py);x.lineTo(ox+6,py+10);x.lineTo(ox,py+20);x.lineTo(ox-6,py+10);x.closePath();x.fill();
    x.fillStyle=col(b,10);x.fillRect(ox-1,py+8,2,4);x.fillRect(ox-3,py+10,6,1);}
  // škvrny od vody a odlupujúca sa tapeta
  for(let i=0;i<22;i++){const sx=r()*384,sy=r()*100,sl=20+r()*70;const gg=x.createLinearGradient(0,sy,0,sy+sl);gg.addColorStop(0,'rgba(0,0,0,.35)');gg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gg;x.fillRect(sx,sy,2+r()*5,sl)}
  for(let i=0;i<7;i++){const sx=r()*380,sy=30+r()*110;x.fillStyle=col(b,-20);x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+14,sy+3);x.lineTo(sx+10,sy+16);x.lineTo(sx+2,sy+11);x.closePath();x.fill();x.fillStyle='rgba(0,0,0,.4)';x.fillRect(sx+2,sy+11,9,2);}
  for(let i=0;i<500;i++){x.fillStyle=`rgba(0,0,0,${r()*.2})`;x.fillRect(r()*384,r()*176,1,1)}
  // lambria (drevený obklad)
  for(let px=0;px<384;px+=32){x.fillStyle='#1d120b';x.fillRect(px,176,32,64);x.fillStyle='#2a1a10';x.fillRect(px+3,184,26,44);x.fillStyle='#38241a';x.fillRect(px+3,184,26,1);x.fillRect(px+3,184,1,44);x.fillStyle='#120a06';x.fillRect(px+3,227,26,1);x.fillRect(px+28,184,1,44);
    x.fillStyle='#34241a';x.fillRect(px+8,190,16,32);x.fillStyle='#20140c';x.fillRect(px+8,190,16,1);x.fillRect(px+8,190,1,32);}
  x.fillStyle='#4a3224';x.fillRect(0,174,384,4);x.fillStyle='#6a4a34';x.fillRect(0,174,384,1);x.fillStyle='#120a06';x.fillRect(0,178,384,2);
  x.fillStyle='#1a0f09';x.fillRect(0,230,384,10);x.fillStyle='#2e1d12';x.fillRect(0,230,384,1);
  // spodok (priepasť)
  x.fillStyle='#08060a';x.fillRect(0,240,384,32);
  // rímsa
  x.fillStyle='#120b0c';x.fillRect(0,0,384,14);x.fillStyle='#2a1a1a';x.fillRect(0,10,384,3);x.fillStyle='#3c2828';x.fillRect(0,10,384,1);
  for(let px=4;px<384;px+=12){x.fillStyle='#1f1313';x.fillRect(px,3,6,5)}
  // okná – vyrezanie otvorov
  const wins=[48,240];
  const wp=(wx)=>{x.beginPath();x.moveTo(wx,150);x.lineTo(wx,52);x.arc(wx+24,52,24,Math.PI,0);x.lineTo(wx+48,150);x.closePath()};
  wins.forEach(wx=>{x.save();x.globalCompositeOperation='destination-out';wp(wx);x.fill();x.restore();
    // kamenný rám
    x.save();x.lineWidth=7;x.strokeStyle='#3b3631';wp(wx);x.stroke();x.lineWidth=1;x.strokeStyle='#6a625a';x.save();x.translate(-0.5,-0.5);wp(wx);x.restore();x.stroke();x.restore();

function updateParticles(){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l--;
    if(p.l<=0){parts.splice(i,1);continue}
    if(p.t==='b'){p.px=p.x;p.py=p.y;p.vy+=0.17;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;

function updatePlayer(){
  const p=P;
  const L=down('ArrowLeft','KeyA'),Rg=down('ArrowRight','KeyD'),Dn=down('ArrowDown','KeyS');
  const jumpP=hit('ArrowUp','KeyW','Space'),jumpH=down('ArrowUp','KeyW','Space');
  const shootP=hit('ControlLeft','ControlRight','KeyJ','KeyX'),shootH=down('ControlLeft','ControlRight','KeyJ','KeyX');
  if(p.dead){p.vy=Math.min(p.vy+0.3,7);p.vx*=0.9;moveEntity(p);return}
  // drepenie
  const grav=p.grav||1;
  const wantCrouch=Dn&&p.onGround&&grav>0;
  if(wantCrouch&&!p.crouch){p.crouch=true;p.y+=9;p.h=15}
  else if(!wantCrouch&&p.crouch&&p.onGround&&canStand()){p.crouch=false;p.y-=9;p.h=24}
  // chôdza
  const max=p.crouch?0.6:1.75,acc=p.onGround?0.24:0.15;
  if(L&&!Rg){p.vx-=acc;p.face=-1}else if(Rg&&!L){p.vx+=acc;p.face=1}
  else if(p.onGround)p.vx*=0.78;else p.vx*=0.97;
  p.vx=clamp(p.vx,-max-(p.vx>max?2:0),max+2);
  if(Math.abs(p.vx)>max&&p.onGround&&!p.hurtFlash)p.vx=lerp(p.vx,sign(p.vx)*max,0.3);
  // skok
  if(jumpP)p.jbuf=7;
  if(p.jbuf>0)p.jbuf--;
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(Dn&&jumpP&&p.onGround&&grav>0&&tileAt(Math.floor((p.x+p.w/2)/T),Math.floor((p.y+p.h+1)/T))==='='){p.drop=10;p.y+=1;p.jbuf=0}
  if(p.drop>0)p.drop--;
  if(p.jbuf>0&&p.coyote>0&&!p.crouch){p.vy=-5.9*grav;p.jbuf=0;p.coyote=0;Snd.jump()}
  if(!jumpH&&-p.vy*grav>2.4)p.vy=-2.4*grav;
  p.vy=clamp(p.vy+0.3*grav,-7.5,7.5);
  const wasG=p.onGround,fv=p.vy;
  moveEntity(p);
  if(p.onGround&&!wasG&&fv*grav>3){Snd.land();dust(p.x+p.w/2,grav>0?p.y+p.h:p.y,6);if(fv*grav>6)shake=Math.max(shake,3)}
  if(p.onGround&&Math.abs(p.vx)>0.4){const ph0=p.walk;p.walk+=Math.abs(p.vx)*0.17;if(Math.floor(ph0/Math.PI)!==Math.floor(p.walk/Math.PI))Snd.step()}else if(p.onGround)p.walk*=0.9;
  // pasce a pád
  if(p.y>H+10){p.hp=0;killPlayer();return}
  const bt=Math.floor((p.y+p.h-1)/T);if(bt>=16){const tx0=Math.floor(p.x/T),tx1=Math.floor((p.x+p.w-1)/T);if((tileAt(tx0,16)==='^'||tileAt(tx1,16)==='^')&&p.y+p.h>262){if(p.inv<=0){hurtPlayer(35,-p.face);}p.vy=-8;p.y=Math.min(p.y,250-p.h+8)}}
  // zbraň
  if(p.cd>0)p.cd--;if(p.recoil>0)p.recoil=Math.max(0,p.recoil-0.07);if(p.flash>0)p.flash--;if(p.dryT>0)p.dryT--;
  if(p.pumpT>0){p.pumpT--;if(p.pumpT===0){const m=muzzle();addP({t:'cs',x:p.x+p.w/2+p.face*2,y:p.y+p.h-(p.crouch?10:15),vx:-p.face*rnd(1.2,2)+0,vy:rnd(-3,-2),l:240,rot:0,px:0,py:0})}}
  if(shootP||(shootH&&p.cd===0)){
    if(p.cd===0&&p.dryT===0){ if(p.mag>0)fire(); else if(p.reserve>0){Snd.dry();p.dryT=20;startReload()} else {Snd.dry();p.dryT=25;toast('Došli náboje!',70)}}
  }
  if(hit('KeyR','KeyK'))startReload();
  if(p.reload>0){p.rt--;if(p.rt<=0){p.mag++;p.reserve--;Snd.shell();
      if(p.mag<6&&p.reserve>0)p.rt=20;else{p.reload=0;Snd.pump(0);p.cd=26}}}
  if(p.inv>0)p.inv--;
  if(p.hurtFlash>0)p.hurtFlash=Math.max(0,p.hurtFlash-0.03);
  if(p.hp<30&&Game.t%66===0)Snd.heart();
  // predmety
  const pr={x:p.x-2,y:p.y-2,w:p.w+4,h:p.h+4};
  for(const it of items){if(it.got)continue;if(rectsOv(pr,{x:it.x-7,y:it.y-7,w:14,h:14})){
    if(it.k==='heal'&&p.hp>=100)continue;
    it.got=true;
    if(it.k==='key'){p.key=true;score+=200;Snd.pickup('key');toast('Máš kľúč! Nájdi dvere.',150)}
    else if(it.k==='ammo'){p.reserve+=6;score+=10;Snd.pickup('ammo');toast('+6 nábojov',70)}
    else if(it.k==='heal'){p.hp=Math.min(100,p.hp+40);Snd.pickup('heal');toast('+40 zdravia',70)}
    else if(it.k==='gem'){const v=[100,200,300,500][it.v];score+=v;Snd.pickup('gem');toast('+'+v,60)}
    else if(it.k==='life'){lives++;Snd.pickup('heal');toast('Extra život!',120)}
  }}
  // kontrolné body
  for(const d of decos)if(d.k==='check'&&!d.on&&Math.abs(d.x-(p.x+p.w/2))<14&&Math.abs(d.y-(p.y+p.h))<24){d.on=true;checkpoint={x:d.x,y:d.y};Snd.checkpoint();toast('Kontrolný bod',100);p.hp=Math.min(100,p.hp+15)}
  // tajná stena a vchod
  if(lv.crack&&lv.crack.alive){const ck=lv.crack,dd=Math.abs((ck.tx+0.5)*T-(p.x+p.w/2));ck.glow=Math.max(0,(ck.glow||0)-0.03);
    if(dd<170){p.hintT=(p.hintT===undefined?120:p.hintT)-1;if(p.hintT<=0){p.hintT=rint(220,380);Snd.whisper(clamp(1-dd/170,.25,1)*.9)}}}
  if(secretDoor&&!lv.secret&&(!lv.crack||!lv.crack.alive)&&Math.abs(secretDoor.x-(p.x+p.w/2))<12&&Math.abs(secretDoor.y-(p.y+p.h))<10){enterSecret();return}
  // dvere
  if(doorObj){const dd=doorObj;if(Math.abs(dd.x-(p.x+p.w/2))<14&&Math.abs(dd.y-(p.y+p.h))<10){
    if(p.key){levelComplete()}else if(dd.tried<=0){dd.tried=120;Snd.locked();toast('Dvere sú zamknuté – nájdi kľúč!',120)}}
    if(dd.tried>0)dd.tried--;}
}

/* ---------- nepriatelia ---------- */
function ledgeAhead(e){const ax=Math.floor((e.x+e.w/2+e.dir*(e.w/2+3))/T),fy=Math.floor((e.y+e.h+2)/T);const f=tileAt(ax,fy);return f!=='#'&&f!=='='}
function groundBelow(x,from){let ty=Math.floor(from/T);for(;ty<lv.h;ty++){const c=tileAt(Math.floor(x/T),ty);if(c==='#'||c==='=')return ty*T}return 15*T}
function updEnemy(e){
  if(!e.alive)return;e.t++;if(e.hurt>0)e.hurt--;
  const dx=(P.x+P.w/2)-(e.x+e.w/2),dy=(P.y+P.h/2)-(e.y+e.h/2),ad=Math.abs(dx),pd=P.dead;
  let contact=true;
  const vol=clamp(1-Math.hypot(dx,dy)/320,0,1);
  switch(e.type){
  case 'zombie':{
    const near=ad<210&&Math.abs(dy)<44&&!pd;
    if(e.stun>0){e.stun--;e.vx*=0.85}
    else{let sp=0.22;if(near){e.dir=dx>0?1:-1;sp=e.spd}else if(e.t%200===0&&Math.random()<.5)e.dir*=-1;
      if(e.onGround&&ledgeAhead(e)){sp=0;if(!near)e.dir*=-1}
      if(e.hitWall&&!near)e.dir*=-1;
      e.vx=lerp(e.vx,e.dir*sp,0.1)}
    e.vy=Math.min(e.vy+0.3,7);moveEntity(e);
    if(near&&--e.gT<=0){Snd.growl('zombie',vol);e.gT=rint(160,380)}
    break}
  case 'ghost':{
    const dist=Math.hypot(dx,dy),near=dist<200&&!pd;
    if(e.recoil>0){e.recoil--;e.x-=sign(dx)*1.1;e.y-=0.2}
    else if(near){const a=Math.atan2(dy,dx),sp=0.5+0.12*Math.sin(e.t*.05);e.x+=Math.cos(a)*sp;e.y+=Math.sin(a)*sp*0.8+Math.sin(e.t*.09)*0.35}
    else{e.x+=(e.ox-(e.x+e.w/2))*0.01;e.y=lerp(e.y,e.oy+Math.sin(e.t*.04)*7,0.05)}
    e.dir=dx>0?1:-1;
    if(near&&--e.gT<=0){Snd.growl('ghost',vol);e.gT=rint(260,520)}
    break}
  case 'spider':{
    if(e.state==='hang'){e.y=32+14+Math.sin(e.t*.06)*2;contact=true;
      if(ad<50&&P.y+P.h>e.y+10&&!pd){e.state='drop';e.vy=0;Snd.growl('spider',Math.max(vol,.5))}}
    else if(e.state==='drop'){e.vy=Math.min(e.vy+0.4,7);moveEntity(e);if(e.onGround)e.state='crawl'}
    else{const near=ad<240&&Math.abs(dy)<70&&!pd;
      if(near){e.dir=dx>0?1:-1;e.vx=lerp(e.vx,e.dir*1.15,0.15);
        if(e.onGround&&ad<60&&e.cd<=0&&Math.random()<.04){e.vy=-3.4;e.vx=e.dir*1.9;e.cd=70;Snd.growl('spider',vol)}
        if(e.hitWall&&e.onGround)e.vy=-3.2}
      else e.vx*=0.9;
      if(e.onGround&&ledgeAhead(e)&&Math.abs(e.vx)>0.2){e.vx=0}
      e.cd--;e.vy=Math.min(e.vy+0.3,7);moveEntity(e)}
    break}
  case 'hand':{
    if(e.state==='buried'){contact=false;if(ad<85&&Math.abs(dy)<40&&!pd){e.state='emerge';e.t=0;Snd.growl('hand',Math.max(vol,.6))}}
    else if(e.state==='emerge'){contact=false;if(e.t>34){e.state='crawl'}}
    else{e.cd--;
      if(e.onGround){e.vx*=0.7;if(e.cd<=0&&!pd&&ad<220){e.dir=dx>0?1:-1;e.vy=-3.4;e.vx=e.dir*1.6;e.cd=rint(34,60);Snd.growl('hand',vol)}}
      e.vy=Math.min(e.vy+0.3,7);moveEntity(e)}
    break}
  case 'lord':{updLord(e);contact=e.alpha>0.8&&e.state!=='fake'&&e.state!=='wait';break}
  case 'brute':case 'boss':{
    const boss=e.type==='boss';const near=ad<280&&Math.abs(dy)<80&&!pd;
    const spd=boss?0.75:0.6,cs=boss?3.3:2.8,wind=boss?24:34;
    if(e.state==='idle'||e.state==='float'){if(near){e.state='chase';Snd.growl('brute',.7)}}
    else if(e.state==='chase'){
      e.dir=dx>0?1:-1;let sp=spd;if(ledgeAhead(e))sp=0;
      e.vx=lerp(e.vx,e.dir*sp,0.08);e.cd--;
      if(ad<130&&e.cd<=0&&!pd&&Math.abs(dy)<50){e.state='wind';e.st=e.t;Snd.growl('brute',1)}
      if(boss&&e.t%260===0){const alive=enemies.filter(q=>q.alive&&q.type==='hand').length;if(alive<3){const hx=clamp(P.x+P.w/2+rnd(-70,70),40,lv.w*T-40);const gy=groundBelow(hx,P.y);
        const hnd=mkEnemy('h',0,0,hx,gy);hnd.state='emerge';hnd.t=0;enemies.push(hnd);Snd.growl('hand',.8);dust(hx,gy,8)}}
      if(!near&&ad>340)e.state='idle';
    }
    else if(e.state==='wind'){e.vx*=0.7;if(e.t-e.st>wind){e.state='charge';e.st=e.t;e.vx=e.dir*cs}}
    else if(e.state==='charge'){e.vx=e.dir*cs;
      if(Math.random()<.4)dust(e.x+e.w/2-e.dir*8,e.y+e.h,1);
      if(e.hitWall||e.t-e.st>60||(e.onGround&&ledgeAhead(e))){const w=e.hitWall;e.state='stun';e.st=e.t;e.stunT=w?(boss?70:85):30;e.cd=boss?35:60;e.vx=w?-e.dir*1:0;
        if(w){shake=Math.max(shake,10);dust(e.x+e.w/2+e.dir*10,e.y+e.h,10);Snd.land()}}}
    else if(e.state==='stun'){e.vx*=0.85;if(e.t-e.st>e.stunT)e.state='chase'}
    e.vy=Math.min(e.vy+0.3,7);moveEntity(e);
    if(e.state==='charge')e.dmgNow=boss?42:35;else e.dmgNow=e.dmg;
    if(e.state==='chase'&&--e.gT<=0){Snd.growl('brute',vol*.7);e.gT=rint(300,500)}
    break}
  }
  if(e.y>H+40)e.alive=false;
  if(contact&&!pd&&e.alive){
    const ix=e.type==='hand'||e.type==='spider'?1:3;
    if(P.x+P.w>e.x+ix&&P.x<e.x+e.w-ix&&P.y+P.h>e.y+2&&P.y<e.y+e.h-2){
      hurtPlayer(e.dmgNow||e.dmg,dx>0?-1:1);
      if(e.type==='ghost')e.recoil=40;
    }
  }
}

/* ---------- prostredie ---------- */
function updateEnv(){
  // blesky
  Env.next--;
  if(Env.next<=0&&Env.lt<0){Env.lt=0;Env.next=rint(420,1000);Env.boltX=rnd(40,W-40);
    Env.boltPts=[];let bx=Env.boltX,by=0;while(by<150){Env.boltPts.push([bx,by]);bx+=rnd(-9,9);by+=rnd(8,16)}
    Snd.thunder(rnd(0.1,2.2),rnd(0.6,1.2))}
  if(Env.lt>=0){Env.lt++;
    if(Env.lt===1){Env.flash=1;Env.bolt=8}else if(Env.lt===6)Env.flash=Math.max(Env.flash,.35);else if(Env.lt===11){Env.flash=1;Env.bolt=6}else if(Env.lt>=30)Env.lt=-1}
  Env.flash*=0.9;if(Env.bolt>0)Env.bolt--;
  // dážď
  if(!Env.rain.length)for(let i=0;i<110;i++)Env.rain.push({x:Math.random()*(W+40),y:Math.random()*180,v:rnd(5,8),l:rnd(5,10)});
  for(const r of Env.rain){r.y+=r.v;r.x-=r.v*0.25;if(r.y>180){r.y=-10;r.x=Math.random()*(W+40)}}
  // prach
  for(const m of Env.motes){m.x+=m.vx;m.y+=m.vy;m.ph+=0.02;if(m.x<0)m.x+=W;if(m.x>W)m.x-=W;if(m.y<0)m.y+=H;if(m.y>H)m.y-=H}
  // plamene a kvapky
  if(lv)for(const d of decos){if((d.k==='torch'||d.k==='candle'||(d.k==='check'&&d.on))&&Math.random()<0.05&&Math.abs(d.x-cam.x-W/2)<W){addP({t:'em',x:d.x+rnd(-2,2),y:d.y-(d.k==='candle'?18:2),vx:rnd(-.1,.2),vy:rnd(-.5,-.2),l:rint(30,70),c:lv.theme.flame,s:1})}}
  shake*=0.86;if(shake<0.2)shake=0;
  sx=shake?rnd(-shake,shake)*0.5:0;sy=shake?rnd(-shake,shake)*0.5:0;
  for(let i=tracers.length-1;i>=0;i--){if(--tracers[i].l<=0)tracers.splice(i,1)}
  if(toastQ){toastQ.t--;if(toastQ.t<=0)toastQ=null}
}
function updateCam(snap){
  const tx=clamp(P.x+P.w/2-W/2+P.face*34,0,lv.w*T-W);
  cam.x=snap?tx:lerp(cam.x,tx,0.09);
}
function levelComplete(){
  const bonus={hp:P.hp*5,ammo:(P.mag+P.reserve)*20,lives:lives*250};
  score+=bonus.hp+bonus.ammo+bonus.lives;bonusInfo=bonus;
  Game.state='clear';Game.timer=0;Snd.door();setTimeout(()=>Snd.clear(),500);
}
function startGame(){score=0;lives=3;P=null;savedWorld=null;SB=null;secretsDone=0;Snd.secretMood(false);loadLevel(0);Game.state='intro';Game.timer=0;Snd.musicbox&&Snd.ready&&0}
function nextLevel(){
  if(levelIdx>=1){Game.state='win';Game.timer=0;return}
  loadLevel(levelIdx+1);Game.state='intro';Game.timer=0;
}

function step(){
  Game.t++;
  if(Game.state==='title'){updateEnv();updateParticles();return}
  if(Game.state==='intro'){Game.timer++;updateEnv();updateParticles();updateCam(true);if(Game.timer>160||hit('Enter')){Game.state='play'}return}
  if(Game.state==='clear'){Game.timer++;updateEnv();updateParticles();if(Game.timer>60&&hit('Enter'))nextLevel();return}
  if(Game.state==='gameover'||Game.state==='win'){Game.timer++;updateEnv();updateParticles();if(Game.timer>40&&hit('Enter')){Game.state='title';if(lv.secret){savedWorld=null;SB=null;loadLevel(0);Snd.secretMood(false)}}return}
  if(Game.state==='fake'){stepFake();return}
  if(Game.state==='secretwin'){Game.timer++;updateEnv();updateParticles();if(Game.timer>80&&hit('Enter'))leaveSecret();return}
  if(Game.hitstop>0){Game.hitstop--;updateEnv();return}
  if(Game.state==='dying'){Game.timer++;updatePlayer();enemies.forEach(updEnemy);updateEnv();updateParticles();updateCam();
    if(Game.timer>130){if(lives<=0){Game.state='gameover';Game.timer=0}else respawn()}return}
  // play
  updatePlayer();
  if(Game.state!=='play')return;
  for(const e of enemies)updEnemy(e);
  if(lv.secret&&SB)updateSecret();
  updateEnv();updateParticles();updateCam();
  for(const it of items)it.ph+=0.08;
}

function newSB(){return {shots:[],clone:null,dark:0,darkT:0,warnDark:0,grav:1,flipT:0,flipWarn:0,fakeDone:false,specialCd:360,glow:[0,0,0],flash:[0,0,0],ammoT:700,endT:0,lastSp:''}}

function spawnClone(){

function killClone(c,byPlayer){
  const cx=c.x+c.w/2,cy=c.y+c.h/2;
  for(let i=0;i<22;i++)addP({t:'c',x:cx+rnd(-4,4),y:cy+rnd(-10,10),vx:rnd(-2.4,2.4),vy:rnd(-3,.5),l:rint(80,200),c:['#cfe0ff','#8aa0d0','#ffffff'][rint(0,2)],s:rint(1,3),px:cx,py:cy,rot:0});

function damageClone(d,dir,px,py){const c=SB&&SB.clone;if(!c)return;c.hp-=d;for(let i=0;i<3;i++)addP({t:'sp',x:px,y:py,vx:rnd(-1.5,1.5),vy:rnd(-2,0),l:14,c:'#cfe8ff',s:1});if(c.hp<=0)killClone(c,true)}
function updateClone(){
  const c=SB.clone;if(!c)return;
  c.life--;c.alpha=Math.min(1,c.alpha+0.02);
  c.x=ARC*2-(P.x+P.w);c.y=P.y;c.h=P.h;c.crouch=P.crouch;c.face=-P.face;c.vx=-P.vx;c.walk=P.walk;c.onGround=P.onGround;c.grav=P.grav||1;c.inv=0;
  c.recoil=Math.max(0,c.recoil-.07);if(c.flash>0)c.flash--;

function fireClone(c){

function resize(){
  const pr=getComputedStyle(document.getElementById('probe')),il=parseFloat(pr.paddingLeft)||0,ir=parseFloat(pr.paddingRight)||0;
  const aw=Math.max(100,innerWidth-il-ir),ah=innerHeight,s=Math.min(aw/W,ah/H),wr=document.getElementById('wrap');
  wr.style.width=Math.floor(W*s)+'px';wr.style.height=Math.floor(H*s)+'px';wr.style.left=(il+aw/2)+'px';Game.scale=s;
  const portrait=innerHeight>innerWidth;document.body.classList.toggle('portrait',portrait);
  if(Game.touch&&portrait&&['play','dying','intro'].includes(Game.state)&&!Game.paused)setPaused(true);
}
addEventListener('orientationchange',()=>setTimeout(resize,250));
/* ---------- dotykové ovládanie ---------- */
const TK={};let touchOn=false;
function enableTouch(){if(touchOn)return;touchOn=true;Game.touch=true;document.body.classList.add('touch');resize()}
function canTap(){return Game.paused||(Game.state!=='play'&&Game.state!=='dying')}
function toggleFS(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const rq=el.requestFullscreen||el.webkitRequestFullscreen;
  if(rq){const p=rq.call(el);const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(p&&p.then)p.then(lock).catch(()=>{});else lock()}
}
function touchSync(e){
  const cur={};
  for(const t of e.touches){const el=document.elementFromPoint(t.clientX,t.clientY),b=el&&el.closest&&el.closest('.tb');if(b&&b.dataset.key)cur[b.dataset.key]=1}
  for(const k in cur)if(!TK[k]){keys[k]=true;pressed[k]=true}
  for(const k in TK)if(!cur[k])keys[k]=false;
  for(const k in TK)delete TK[k];Object.assign(TK,cur);
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',!!(b.dataset.key&&cur[b.dataset.key])));
}
document.addEventListener('touchstart',e=>{
  enableTouch();Snd.init();e.preventDefault();
  for(const t of e.changedTouches){const el=document.elementFromPoint(t.clientX,t.clientY);
    if(!(el&&el.closest&&el.closest('.tb'))&&canTap()&&!document.body.classList.contains('portrait')){pressed.Enter=true;keys.Enter=true;setTimeout(()=>{keys.Enter=false},120)}}
  touchSync(e);
},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();touchSync(e)},{passive:false});
const tEnd=e=>{
  e.preventDefault();Snd.init();touchSync(e);
  for(const t of e.changedTouches){const el=document.elementFromPoint(t.clientX,t.clientY),b=el&&el.closest&&el.closest('.tb');
    if(b&&b.dataset.act==='fs')toggleFS();
    else if(!b&&Game.state==='title'&&!Game.fsTried&&(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)&&!document.fullscreenElement){Game.fsTried=true;toggleFS()}}
};
document.addEventListener('touchend',tEnd,{passive:false});
document.addEventListener('touchcancel',tEnd,{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0)enableTouch();
addEventListener('resize',resize);
function setPaused(p){if(Game.paused===p)return;Game.paused=p;Snd.pause(p)}

let lastT=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-lastT;lastT=now;if(dt>200)dt=200;
  if(hit('KeyM')){Snd.init();Snd.toggleMute()}
  if(hit('Equal','NumpadAdd','BracketRight'))Snd.setVol(Snd.vol+0.1);
  if(hit('Minus','NumpadSubtract','BracketLeft','Slash'))Snd.setVol(Snd.vol-0.1);
  if(hit('KeyB')){Env.br=(Env.br+1)%3;toast('Jas: '+BRN[Env.br],70)}
  if(hit('KeyP')&&['play','dying','intro'].includes(Game.state))setPaused(!Game.paused);
  if(hit('Enter')){
    if(Game.state==='title'){startGame()}
    else if(Game.paused){setPaused(false)}
  }
  let steps=0;
  if(!Game.paused){acc+=dt;while(acc>=16.667&&steps<5){step();acc-=16.667;steps++}}
  if(steps>0||Game.paused){for(const k in pressed)delete pressed[k]}
  render();
}
function render(){
  if(Game.state==='title'){
    const span=lv.w*T-W;const tt=(Game.t*0.4)%(span*2);cam.x=tt<span?tt:span*2-tt;
    P.x=cam.x+W/2+Math.sin(Game.t*.013)*150;P.y=196;P.vx=0;P.inv=0;P.flash=0;P.face=Math.cos(Game.t*.013)>0?1:-1;
    enemies.forEach(e=>{if(e.alive)e.t++});
  }
  renderScene();
  // vertikálne/horizontálne otrasy cez CSS (HUD sa netrasie)
  cv.style.scale=(SB&&SB.grav<0)?'1 -1':'1 1';
  const k=(Game.scale||1);cv.style.transform=(sx||sy)?`translate(${(sx*k).toFixed(1)}px,${(sy*k).toFixed(1)}px)`:'none';
  drawUI();
}
function init(){
  genLightSprites();fogCv=genFog();cloudCv=genClouds();
  loadLevel(0);
  Game.state='title';resize();
  requestAnimationFrame(frame);
}
